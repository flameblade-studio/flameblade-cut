packages:
  - "apps/*"
  - "packages/*"
patchedDependencies:
  "@ffmpeg/core-mt@0.12.6": "patches/@ffmpeg__core-mt@0.12.6.patch"
  "@ffmpeg/core@0.12.6": "patches/@ffmpeg__core@0.12.6.patch"
onlyBuiltDependencies:
  - electron
ignoredBuiltDependencies:
  - core-js
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
  - workerd
allowBuilds:
  core-js: false
  electron: true
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  workerd: false
# Run package scripts through pnpm's cross-platform shell so POSIX-style
# `VAR=1 cmd` prefixes (used by the desktop build) also work on Windows.
shellEmulator: true
