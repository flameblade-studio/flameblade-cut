appId: tw.flamebladestudio.cut
productName: Flameblade Cut
# Predictable, space-free, arch-suffixed names → clean R2 URLs + a simple
# manifest (e.g. OpenReel-1.2.3-arm64.dmg, OpenReel-1.2.3-x64.exe).
artifactName: FlamebladeCut-${version}-${arch}.${ext}
asar: true
# The MCP stdio shim must be a real on-disk file so external clients (Claude
# Desktop / Cursor / Cline) can spawn it with `node`; unpack it from the asar.
asarUnpack:
  - dist/mcp-shim/**
directories:
  output: release
# No update feed yet: the inherited OpenReel feed (dl.openreel.video) would
# replace this app with upstream builds. Add our own GitHub Releases feed here
# before enabling the updater (FLAMEBLADE_ENABLE_UPDATER, see main/updater.ts).
publish: null
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Upstream signed and notarized with its author's Apple Developer ID; this
  # fork ships Windows builds only for now and has no Apple identity yet.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 炎劍剪輯 Flameblade Cut
  uninstallDisplayName: 炎劍剪輯 Flameblade Cut
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  license: ../../LICENSE
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
